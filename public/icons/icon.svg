<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Cinema Clapperboard / Screen Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="8 12" opacity="0.6"/>

  <!-- Play Symbol / Sync Dual Arrows -->
  <path d="M 210,175 L 340,256 L 210,337 Z" fill="url(#accentGrad)" filter="url(#neonGlow)"/>

  <!-- Live Sync Waves / Wi-Fi Signals -->
  <path d="M 320,160 C 355,188 375,220 375,256 C 375,292 355,324 320,352" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 350,130 C 395,168 420,210 420,256 C 420,302 395,344 350,382" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Friend Dots (Real-time watching) -->
  <circle cx="150" cy="370" r="14" fill="#8b5cf6" filter="url(#neonGlow)"/>
  <circle cx="190" cy="370" r="14" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="230" cy="370" r="14" fill="#10b981" filter="url(#neonGlow)"/>
</svg>
